pipeline:
  name: LYT CI
  identifier: lyt_ci
  projectIdentifier: REPLACE_PROJECT
  orgIdentifier: REPLACE_ORG
  properties:
    ci:
      codebase:
        connectorRef: REPLACE_GITHUB_CONNECTOR
        repoName: LYTCompanySystemv2.0
        build: <+input>
  stages:
    - stage:
        name: Verify
        identifier: verify
        type: CI
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: REPLACE_K8S_CONNECTOR
              namespace: REPLACE_NAMESPACE
              os: Linux
          execution:
            steps:
              - step:
                  type: Run
                  name: API tests
                  identifier: api_tests
                  spec:
                    connectorRef: REPLACE_IMAGE_CONNECTOR
                    image: python:3.12-slim
                    shell: Sh
                    command: cd api && pip install -r requirements.txt && python -m unittest -v
              - step:
                  type: Run
                  name: Web build
                  identifier: web_build
                  spec:
                    connectorRef: REPLACE_IMAGE_CONNECTOR
                    image: node:22-alpine
                    shell: Sh
                    command: cd web && npm ci && npm run build
