pipeline:
  name: LYT CI
  identifier: lyt_ci
  projectIdentifier: REPLACE_PROJECT
  orgIdentifier: REPLACE_ORG
  properties:
    ci:
      codebase:
        connectorRef: REPLACE_GITHUB_CONNECTOR
        repoName: LYTCompanySystemv2.0
        build: <+input>
  stages:
    - stage:
        name: Verify
        identifier: verify
        type: CI
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: REPLACE_K8S_CONNECTOR
              namespace: REPLACE_NAMESPACE
              os: Linux
          serviceDependencies:
            - identifier: postgres
              name: PostgreSQL
              type: Service
              spec:
                connectorRef: REPLACE_IMAGE_CONNECTOR
                image: pgvector/pgvector:pg16
                envVariables:
                  POSTGRES_USER: lyt
                  POSTGRES_PASSWORD: test-only
                  POSTGRES_DB: lyt
            - identifier: redis
              name: Redis
              type: Service
              spec:
                connectorRef: REPLACE_IMAGE_CONNECTOR
                image: redis:7-alpine
          execution:
            steps:
              - step:
                  type: Run
                  name: API tests
                  identifier: api_tests
                  spec:
                    connectorRef: REPLACE_IMAGE_CONNECTOR
                    image: python:3.12-slim
                    shell: Sh
                    envVariables:
                      DATABASE_URL: postgresql://lyt:test-only@localhost:5432/lyt
                      REDIS_URL: redis://localhost:6379/0
                    command: cd api && pip install -r requirements.txt && python -m unittest -v && python acceptance.py
              - step:
                  type: Run
                  name: Web build
                  identifier: web_build
                  spec:
                    connectorRef: REPLACE_IMAGE_CONNECTOR
                    image: node:22-alpine
                    shell: Sh
                    command: cd web && npm ci && npm run build
