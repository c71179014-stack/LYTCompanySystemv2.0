name: lyt-company
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lyt
      POSTGRES_PASSWORD: local-only-password
      POSTGRES_DB: lyt
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "lyt", "-d", "lyt"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: localminio
      MINIO_ROOT_PASSWORD: local-only-minio-password
    ports: ["127.0.0.1:9001:9001"]
    volumes:
      - minio:/data
  migrate:
    build: ./api
    command: ["python", "migrate.py"]
    environment:
      DATABASE_URL: postgresql://lyt:local-only-password@postgres/lyt
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://lyt:local-only-password@postgres/lyt
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: localminio
      AWS_SECRET_ACCESS_KEY: local-only-minio-password
      AWS_DEFAULT_REGION: us-east-1
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    ports: ["127.0.0.1:8000:8000"]
  web:
    build: ./web
    depends_on: [api]
    ports: ["127.0.0.1:8080:80"]
volumes:
  postgres:
  minio:
